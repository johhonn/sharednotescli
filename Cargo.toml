[package]
name = "sharednotescli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
bytes = "1.10.1"
clap = { version = "4.5.30", features = ["derive"], optional = true }
console_error_panic_hook = "0.1.7"
der = "=0.8.0-rc.10"
pkcs8 = "=0.11.0-rc.10"
iroh = "0.97"
iroh-docs = { version = "0.97" }
iroh-blobs = { version = "0.99" }
iroh-gossip = { version = "0.97" }
js-sys = "0.3.77"
tokio = { version = "1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

n0-future = "0.3.2"

dotenv = "0.15.0"
redb = "4.1.0"

[features]
cli = ["tokio/full", "dep:clap"]
